<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Macrame Market</title>
<meta name="description" content="Handmade macrame, made to order. Choose your size and order on Instagram.">
<meta name="theme-color" content="#14110E">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Macrame Market">
<meta property="og:title" content="Macrame Market">
<meta property="og:description" content="Handmade macrame, made to order. Choose your size and order on Instagram.">
<meta property="og:image" content="https://macrame-market.github.io/images/share.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://macrame-market.github.io/product.html">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=El+Messiri:wght@400..600&family=Readex+Pro:wght@300..500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .crumb{display:flex;gap:.6rem;font-size:var(--cap);color:var(--fg-2);padding-top:2rem}
  .crumb a{border-bottom:1px solid transparent;transition:border-color .3s var(--ease)}
  .crumb a:hover{border-color:var(--accent)}
  .pd{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:clamp(2rem,5vw,5rem);padding-block:2rem var(--sec);align-items:start}
  .gallery{display:grid;grid-template-columns:72px minmax(0,1fr);gap:1rem;position:sticky;top:90px}
  .gallery.single{grid-template-columns:minmax(0,1fr)}
  .thumbs{display:flex;flex-direction:column;gap:.7rem}
  .thumbs button{width:72px;aspect-ratio:3/4;overflow:hidden;opacity:.55;outline-offset:2px;border:1px solid transparent;transition:opacity .3s var(--ease),border-color .3s var(--ease)}
  .thumbs button[aria-pressed="true"],.thumbs button:hover{opacity:1;border-color:var(--accent)}
  .thumbs img{width:100%;height:100%;object-fit:cover}
  .stage{max-width:520px;width:100%;aspect-ratio:4/5;justify-self:center}
  .stage img{object-fit:cover}
  .info{display:flex;flex-direction:column;gap:1.2rem}
  .info h1{font-family:var(--display);font-weight:400;font-size:clamp(2.2rem,1.5rem + 2.6vw,3.6rem);line-height:1.1;overflow-wrap:break-word;min-width:0}
  html[lang="ar"] .info h1{font-weight:500;line-height:1.35}
  .facts{border-top:1px solid var(--rule-2);margin-top:.4rem}
  .facts div{display:grid;grid-template-columns:9rem minmax(0,1fr);gap:1.2rem;padding-block:.9rem;border-bottom:1px solid var(--rule)}
  .facts dt{font-size:var(--cap);color:var(--fg-2);padding-top:.15rem}
  .facts dd{font-size:1.02rem}

  /* sizes */
  .sizes{margin-top:1rem;padding:clamp(1.25rem,3vw,2rem);background:var(--cotton-2);display:flex;flex-direction:column;gap:1.3rem}
  .sizes h2{font-family:var(--display);font-weight:400;font-size:1.7rem;line-height:1.25}
  html[lang="ar"] .sizes h2{font-weight:500}
  .size-pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem}
  .size-pick button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15rem;min-height:72px;padding:.6rem;border:1px solid var(--rule-2);background:var(--cotton);color:var(--ink);transition:background-color .25s var(--ease),border-color .25s var(--ease),color .25s var(--ease)}
  .size-pick button b{font-family:var(--display);font-weight:400;font-size:1.5rem;line-height:1}
  html[lang="ar"] .size-pick button b{font-weight:500;font-size:1.25rem;line-height:1.4}
  .size-pick button span{font-size:.8rem;color:var(--fg-2);transition:color .25s var(--ease)}
  .size-pick button:hover{border-color:var(--ink)}
  .size-pick button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--cotton)}
  .size-pick button[aria-pressed="true"] span{color:var(--jute)}
  .dims{border-top:1px solid var(--rule-2)}
  .dims:empty{display:none}
  .dims div{display:flex;justify-content:space-between;gap:1rem;padding-block:.7rem;border-bottom:1px solid var(--rule)}
  .dims dt{font-size:var(--cap);color:var(--fg-2)}
  .dims dd{font-size:1rem}
  .sizes .btn{align-self:flex-start}
  .hint{font-size:.85rem;color:var(--fg-2)}

  .more{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(1rem,2vw,1.5rem)}
  .more a{display:flex;flex-direction:column;gap:.7rem}
  .more .ph{aspect-ratio:3/4}
  .more a:hover .ph img{transform:scale(1.04)}
  .more b{font-family:var(--display);font-weight:400;font-size:1.2rem}
  html[lang="ar"] .more b{font-weight:500}

  .toast{position:fixed;inset-inline:0;bottom:1.5rem;margin:auto;width:max-content;max-width:calc(100% - 2rem);background:var(--night);color:var(--cotton);padding:.8rem 1.2rem;font-size:.92rem;opacity:0;transform:translateY(10px);transition:opacity .3s var(--ease),transform .3s var(--ease);pointer-events:none;z-index:80}
  .toast.on{opacity:1;transform:none}

  @media (max-width:900px){
    .pd{grid-template-columns:minmax(0,1fr)}
    .gallery{position:static;grid-template-columns:minmax(0,1fr)}
    .thumbs{flex-direction:row;order:2}
    .thumbs button{width:64px}
    .more{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media (max-width:520px){.facts div{grid-template-columns:minmax(0,1fr);gap:.2rem}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="ig" viewBox="0 0 24 24"><path d="M12 2.2c3.2 0 3.6 0 4.8.1 3.3.1 4.8 1.7 4.9 4.9.1 1.3.1 1.6.1 4.8s0 3.6-.1 4.8c-.1 3.2-1.7 4.8-4.9 4.9-1.3.1-1.6.1-4.8.1s-3.6 0-4.8-.1c-3.3-.1-4.8-1.7-4.9-4.9C2.2 15.6 2.2 15.2 2.2 12s0-3.6.1-4.8C2.4 3.9 3.9 2.4 7.2 2.3 8.4 2.2 8.8 2.2 12 2.2zm0 4.9a4.9 4.9 0 1 0 0 9.8 4.9 4.9 0 0 0 0-9.8zm0 8.1a3.2 3.2 0 1 1 0-6.4 3.2 3.2 0 0 1 0 6.4zm5.1-9.5a1.15 1.15 0 1 0 0 2.3 1.15 1.15 0 0 0 0-2.3z"/></symbol>
</svg>

<header>
  <div class="bar">
    <div class="bar-start">
      <a class="mark" href="index.html" aria-label="Macrame Market"><span>M</span></a>
      <a class="wordmark" href="index.html">Macrame Market</a>
      <nav class="menu" aria-label="Main">
        <a href="index.html#collection" data-t="nav.collection">Collection</a>
        <a href="index.html#ordering" data-t="nav.order">Ordering</a>
        <a href="index.html#faq" data-t="nav.faq">FAQ</a>
      </nav>
    </div>
    <div class="bar-end">
      <button class="lang" id="lang" type="button" lang="ar">العربية</button>
      <a class="btn" href="https://ig.me/m/macrame_markett"><svg width="16" height="16" aria-hidden="true"><use href="#ig"/></svg><span data-t="nav.cta">Enquire</span></a>
    </div>
  </div>
</header>

<main class="light">
  <div class="wrap">
    <nav class="crumb" aria-label="Breadcrumb"><a href="index.html#collection" data-t="crumb">Collection</a><span aria-hidden="true">/</span><span id="crumbName"></span></nav>
    <div class="pd">
      <div class="gallery" id="gallery">
        <div class="thumbs" id="thumbs" role="group" aria-label="Photos"></div>
        <div class="ph stage" id="stage"></div>
      </div>
      <div class="info">
        <span class="cap" id="kicker"></span>
        <h1 id="name"></h1>
        <p class="lede" id="desc"></p>
        <dl class="facts" id="facts"></dl>

        <div class="sizes">
          <h2 data-t="sz.h">Choose your size</h2>
          <div class="size-pick" id="sizePick" role="group" aria-label="Size"></div>
          <dl class="dims" id="dims"></dl>
          <button class="btn" type="button" id="order"><svg width="16" height="16" aria-hidden="true"><use href="#ig"/></svg><span data-t="sz.send">Order this size on Instagram</span></button>
          <p class="hint" data-t="sz.hint">We copy your order message. Paste it in the Instagram chat and send it.</p>
        </div>
      </div>
    </div>
  </div>
</main>

<section class="sec" style="padding-top:clamp(3.5rem,7vw,5.5rem)">
  <div class="wrap">
    <div class="sec-head"><span class="cap" data-t="more.cap">Also in the collection</span></div>
    <div class="more" id="more"></div>
  </div>
</section>

<footer>
  <div class="wrap">
    <p class="foot-word">Macrame Market</p>
    <div class="foot-row">
      <span data-t="ft.by">Handmade by m&amp;g</span>
      <a href="https://www.instagram.com/macrame_markett/" dir="ltr">@macrame_markett</a>
      <span dir="ltr">&copy; 2026 Macrame Market</span>
    </div>
  </div>
</footer>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  var IG = 'https://ig.me/m/macrame_markett';

  // Every piece comes in three sizes. Fill each size's measurements as pairs of
  // [English label, Arabic label, value], for example:
  //   M: [['Width', 'العرض', '90 cm'], ['Height', 'الارتفاع', '150 cm']]
  // A size with no measurements yet shows none.
  var SIZE_KEYS = ['S', 'M', 'L'];

  var P = {
    'hanging-chairs': {
      photos: ['chair', 'custom', 'home-1'],
      sizes: { S: [], M: [], L: [] },
      en: { name: 'Hanging chair', kicker: 'Indoor', desc: 'A handmade macrame chair with a comfortable cushioned seat, for a quiet corner of the bedroom or living room.' },
      ar: { name: 'كرسي معلق', kicker: 'للبيت', desc: 'كرسي مكرمية شغل إيد، بقعدة مريحة ومخدات، يعملك ركن هادي في أوضة النوم أو الصالة.' }
    },
    'terrace-swings': {
      photos: ['terrace', 'hero', 'terrace-3', 'home-2', 'terrace-2'],
      sizes: { S: [], M: [], L: [] },
      en: { name: 'Terrace swing', kicker: 'Outdoor', desc: 'A wide handmade hanging bed for the terrace, the chalet or the garden, finished with a long fringe.' },
      ar: { name: 'مرجيحة تراس', kicker: 'للتراس والجنينة', desc: 'مرجيحة واسعة شغل إيد للتراس أو الشاليه أو الجنينة، وتحتها شراشيب طويلة.' }
    },
    'wall-hangings': {
      photos: ['wall', 'wall-2'],
      sizes: { S: [], M: [], L: [] },
      en: { name: 'Wall hangings and curtains', kicker: 'For the wall', desc: 'Handmade macrame pieces for a wall, a doorway or a window.' },
      ar: { name: 'قطع للحيطة وستاير', kicker: 'للحيطة', desc: 'قطع مكرمية شغل إيد للحيطة أو الباب أو الشباك.' }
    },
    'hair-accessory-holder': {
      photos: ['holder', 'holder-2'], focus: '50% 0%',
      sizes: { S: [], M: [], L: [] },
      en: { name: 'Hair accessory holder', kicker: 'For her room', desc: 'A handmade wall holder for clips and bows, with two long braids and a wooden face.' },
      ar: { name: 'حامل توك وإكسسوارات', kicker: 'لأوضة البنت', desc: 'حامل بيتعلق على الحيطة للتوك والفيونكات، بضفيرتين طوال ووش خشب.' }
    },
    'jute-rugs': {
      photos: ['rug', 'rug-2'],
      sizes: { S: [], M: [], L: [] },
      en: { name: 'Natural rope rug', kicker: 'For the floor', desc: 'A round handmade rug in natural rope, with a scalloped edge of small coils.' },
      ar: { name: 'سجادة طبيعية', kicker: 'للأرضية', desc: 'سجادة مدورة من الحبال الطبيعية، شغل إيد، وحرفها دواير صغيرة.' }
    }
  };
  var ORDER = ['hanging-chairs', 'terrace-swings', 'wall-hangings', 'hair-accessory-holder', 'jute-rugs'];

  var T = {
    en: {
      'nav.collection': 'Collection', 'nav.order': 'Ordering', 'nav.faq': 'FAQ', 'nav.cta': 'Enquire',
      crumb: 'Collection',
      'f.made': 'Making', 'f.madeV': 'Handmade after you order',
      'f.sizes': 'Sizes', 'f.sizesV': 'Small, medium and large',
      'sz.h': 'Choose your size', 'sz.send': 'Order this size on Instagram', 'sz.hint': 'We copy your order message. Paste it in the Instagram chat and send it.',
      S: 'Small', M: 'Medium', L: 'Large',
      'msg.hi': 'Hello Macrame Market, I would like to order:', 'msg.size': 'Size',
      'toast.ok': 'Message copied. Paste it in the Instagram chat.', 'toast.fail': 'Opening Instagram. Tell us the piece and the size in the chat.',
      'more.cap': 'Also in the collection', 'ft.by': 'Handmade by m&g'
    },
    ar: {
      'nav.collection': 'المنتجات', 'nav.order': 'طريقة الطلب', 'nav.faq': 'أسئلة متكررة', 'nav.cta': 'اسألنا',
      crumb: 'المنتجات',
      'f.made': 'الشغل', 'f.madeV': 'شغل إيد، بيتعمل بعد ما تطلبه',
      'f.sizes': 'المقاسات', 'f.sizesV': 'صغير ووسط وكبير',
      'sz.h': 'اختار المقاس', 'sz.send': 'اطلب المقاس ده على انستجرام', 'sz.hint': 'هننسخلك رسالة الطلب. الصقها في شات انستجرام وابعتها.',
      S: 'صغير', M: 'وسط', L: 'كبير',
      'msg.hi': 'أهلًا Macrame Market، عايز أطلب:', 'msg.size': 'المقاس',
      'toast.ok': 'الرسالة اتنسخت. الصقها في شات انستجرام.', 'toast.fail': 'هنفتحلك انستجرام. قولنا القطعة والمقاس في الشات.',
      'more.cap': 'منتجات تانية', 'ft.by': 'شغل إيد من m&g'
    }
  };

  var slug = new URLSearchParams(location.search).get('p');
  if (!P[slug]) slug = ORDER[0];
  var item = P[slug];
  var lang = 'en';
  var size = 'M';
  var html = document.documentElement;
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var t = function (k) { return T[lang][k] || k; };

  function renderSizes() {
    $('#sizePick').innerHTML = SIZE_KEYS.map(function (k) {
      return '<button type="button" data-k="' + k + '" aria-pressed="' + (k === size) + '"><b>' + esc(t(k)) + '</b><span>' + k + '</span></button>';
    }).join('');
    var rows = item.sizes[size] || [];
    $('#dims').innerHTML = rows.map(function (r) {
      return '<div><dt>' + esc(lang === 'ar' ? r[1] : r[0]) + '</dt><dd>' + esc(r[2]) + '</dd></div>';
    }).join('');
  }
  $('#sizePick').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    size = b.dataset.k; renderSizes();
  });

  var toastT;
  function toast(s) { var el = $('#toast'); el.textContent = s; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function () { el.classList.remove('on'); }, 4200); }

  $('#order').addEventListener('click', function () {
    var m = [t('msg.hi'), item[lang].name, t('msg.size') + ': ' + t(size)].join('\n');
    var win = window.open(IG, '_blank', 'noopener');
    var done = function (ok) { toast(t(ok ? 'toast.ok' : 'toast.fail')); if (!win) location.href = IG; };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(m).then(function () { done(true); }, function () { done(false); });
    else done(false);
  });

  function render() {
    var d = item[lang];
    document.title = d.name + ' | Macrame Market';
    $('#crumbName').textContent = d.name;
    $('#kicker').textContent = d.kicker;
    $('#name').textContent = d.name;
    $('#desc').textContent = d.desc;
    $('#facts').innerHTML = [['f.made', 'f.madeV'], ['f.sizes', 'f.sizesV']].map(function (f) { return '<div><dt>' + esc(t(f[0])) + '</dt><dd>' + esc(t(f[1])) + '</dd></div>'; }).join('');
    document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = t(el.dataset.t); });
    document.querySelectorAll('#stage img, #thumbs img').forEach(function (i) { i.alt = d.name; });
    $('#more').innerHTML = ORDER.filter(function (k) { return k !== slug; }).map(function (k) {
      return '<a href="product.html?p=' + k + '"><div class="ph"><img src="images/' + P[k].photos[0] + '.jpg" alt="" loading="lazy"></div><b>' + esc(P[k][lang].name) + '</b></a>';
    }).join('');
    renderSizes();
    var b = $('#lang'); b.textContent = lang === 'ar' ? 'English' : 'العربية'; b.lang = lang === 'ar' ? 'en' : 'ar';
  }

  function setLang(l) {
    lang = l; html.lang = l; html.dir = l === 'ar' ? 'rtl' : 'ltr';
    render();
    try { localStorage.setItem('mm-lang', l); } catch (e) {}
  }

  // Gallery
  var ph = item.photos;
  $('#stage').innerHTML = '<img src="images/' + ph[0] + '.jpg" alt=""' + (item.focus ? ' style="object-position:' + item.focus + '"' : '') + '>';
  if (ph.length > 1) {
    $('#thumbs').innerHTML = ph.map(function (p, i) { return '<button type="button" aria-pressed="' + (i === 0) + '" data-i="' + i + '"><img src="images/' + p + '.jpg" alt=""></button>'; }).join('');
    $('#thumbs').addEventListener('click', function (e) {
      var b = e.target.closest('button'); if (!b) return;
      $('#stage img').src = 'images/' + ph[+b.dataset.i] + '.jpg';
      document.querySelectorAll('#thumbs button').forEach(function (x) { x.setAttribute('aria-pressed', x === b); });
    });
  } else { $('#gallery').classList.add('single'); $('#thumbs').remove(); }

  $('#lang').addEventListener('click', function () { setLang(lang === 'ar' ? 'en' : 'ar'); });
  var q = new URLSearchParams(location.search).get('lang');
  var start = 'en';
  if (q === 'ar' || q === 'en') start = q;
  else { try { if (localStorage.getItem('mm-lang') === 'ar') start = 'ar'; } catch (e) {} }
  setLang(start);
})();
</script>
</body>
</html>
